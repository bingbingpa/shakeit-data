name: 시험일정 갱신

# 조주기능사 시험 일정을 공공데이터포털에서 받아 exam_schedule.json에 굳힌다.
# 앱(bingbingpa/shakeit)은 이 파일을 raw 주소로 읽어간다.
#
# 앱이 API를 직접 부르지 않는 이유는 tool/fetch_exam_schedule.py 첫머리 참고 —
# 요약하면 개발계정 쿼터가 1,000회/일이라 사용자 수를 감당하지 못하고,
# 키를 APK에 넣으면 디컴파일로 새어 나간다.

on:
  schedule:
    # 05:00 KST. 공고가 올라오는 업무시간 전에 한 번 훑는다.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 예약 실행과 수동 실행이 겹쳐 같은 파일을 밀지 않도록.
concurrency:
  group: exam-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 일정 조회
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 tool/fetch_exam_schedule.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- exam_schedule.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam_schedule.json
          git commit -m '[bot] 시험일정 갱신'
          git push
